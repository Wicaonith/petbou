# Les tests du moteur, à chaque poussée. Rapides, sur Linux : c'est le
# garde-fou qui doit répondre en moins d'une minute, pas la compilation.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
