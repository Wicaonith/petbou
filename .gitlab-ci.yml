# Deux étages : les tests tournent sur Linux à chaque poussée (rapide et gratuit),
# l'installeur Windows se déclenche à la main (les runners Windows consomment
# les minutes du forfait — 400/mois sur l'offre gratuite).

stages:
  - test
  - build

tests:
  stage: test
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    when: on_failure
    paths: [dist/]
    expire_in: 1 day

installeur-windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  # Déclenchement manuel depuis l'onglet CI/CD, ou automatique sur une étiquette
  # de version (git tag v0.1.0 && git push --tags).
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    key: windows-deps
    paths:
      - .cargo/registry/
      - src-tauri/target/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  before_script:
    # Le premier passage est long (~15 min) : les outils C++ et Rust sont
    # installés puis mis en cache pour les suivants.
    - choco install -y nodejs-lts --no-progress
    - choco install -y visualstudio2022-workload-vctools --no-progress
    - choco install -y rustup.install --no-progress
    - $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\nodejs;$env:Path"
    - rustup default stable-x86_64-pc-windows-msvc
    - node --version; rustc --version
  script:
    - npm ci
    - npm run app:build
    # Version portable : le même exécutable, plus un dossier `donnees` qui le
    # fait écrire à côté de lui. Posé sur une clé USB, le concours suit.
    - New-Item -ItemType Directory -Force -Path portable/donnees | Out-Null
    - $exe = Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1
    - Copy-Item $exe.FullName "portable/Concours de petanque.exe"
    - Copy-Item PORTABLE.txt portable/LISEZ-MOI.txt
    - Compress-Archive -Path portable/* -DestinationPath concours-petanque-portable.zip -Force
  artifacts:
    name: "concours-petanque-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/release/bundle/msi/*.msi
      - concours-petanque-portable.zip
    expire_in: 30 days
