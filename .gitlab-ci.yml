# Deux étages : les tests tournent sur Linux à chaque poussée (rapide et gratuit),
# l'installeur Windows se déclenche à la main (les runners Windows consomment
# les minutes du forfait — 400/mois sur l'offre gratuite).

stages:
  - test
  - build
  - publication

variables:
  # Où vivent les fichiers téléchargeables d'une version publiée. Le registre de
  # paquets n'expire pas, contrairement aux artefacts de job : c'est ce qui
  # permet de donner au club un lien encore valide dans six mois.
  PAQUET: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/concours-petanque/${CI_COMMIT_TAG}"

tests:
  stage: test
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    when: on_failure
    paths: [dist/]
    expire_in: 1 day

installeur-windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  # Déclenchement manuel depuis l'onglet CI/CD, ou automatique sur une étiquette
  # de version (git tag v0.1.0 && git push --tags).
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    key: windows-deps
    paths:
      - .cargo/registry/
      - src-tauri/target/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  before_script:
    # Le premier passage est long (~15 min) : les outils C++ et Rust sont
    # installés puis mis en cache pour les suivants.
    - choco install -y nodejs-lts --no-progress
    - choco install -y visualstudio2022-workload-vctools --no-progress
    - choco install -y rustup.install --no-progress
    - $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\nodejs;$env:Path"
    - rustup default stable-x86_64-pc-windows-msvc
    - node --version; rustc --version
  script:
    - npm ci
    - npm run app:build
    # Le même script qu'en local, pour que l'archive du pipeline soit
    # exactement ce qu'obtient quelqu'un qui compile sur sa machine.
    - node outils/portable.mjs
    - Compress-Archive -Path "portable/Concours de petanque" -DestinationPath concours-petanque-portable.zip -Force
    # Sur une étiquette de version, les fichiers partent au registre de paquets,
    # qui ne périme pas. Renommés sans accent ni espace : ils deviennent une
    # adresse que l'on peut écrire à la main ou dicter au téléphone.
    - $publier = { param($source, $nom) curl.exe --fail --silent --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $source "$env:PAQUET/$nom" }
    - if ($env:CI_COMMIT_TAG) { & $publier "concours-petanque-portable.zip" "concours-petanque-portable.zip" }
    - if ($env:CI_COMMIT_TAG) { & $publier (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "concours-petanque-setup.exe" }
    - if ($env:CI_COMMIT_TAG) { & $publier (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName "concours-petanque.msi" }
  artifacts:
    name: "concours-petanque-$CI_COMMIT_SHORT_SHA"
    paths:
      # Le portable d'abord : c'est ce qu'on met sur la clé.
      - concours-petanque-portable.zip
      # L'installeur reste comme filet : lui seul sait récupérer WebView2 s'il
      # manque sur un poste ancien.
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/release/bundle/msi/*.msi
    expire_in: 30 days

# La page que l'on donne au club : https://gitlab.com/wicaonith/petbou/-/releases
# Elle ne change jamais d'adresse et ne périme pas, là où un lien vers un
# artefact de job meurt au bout de trente jours.
publication:
  stage: publication
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publication de $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Concours de pétanque $CI_COMMIT_TAG"
    description: |
      **Version portable** : décompressez le dossier, posez-le où vous voulez,
      double-cliquez sur « Concours de petanque.exe ». Rien à installer.

      L'installeur ne sert que sur un poste ancien à qui il manque Microsoft Edge
      WebView2 : lui seul sait le récupérer.

      Windows affichera un avertissement au premier lancement, l'exécutable
      n'étant pas signé. La notice d'installation explique quoi faire, et
      pourquoi apporter le fichier sur une clé USB l'évite complètement.
    assets:
      links:
        - name: "Version portable (rien à installer)"
          url: "${PAQUET}/concours-petanque-portable.zip"
          link_type: package
        - name: "Installeur, si WebView2 manque"
          url: "${PAQUET}/concours-petanque-setup.exe"
          link_type: package
        - name: "MSI, pour un poste géré"
          url: "${PAQUET}/concours-petanque.msi"
          link_type: package
