# Deux étages : les tests tournent sur Linux à chaque poussée (rapide et gratuit),
# l'installeur Windows se déclenche à la main (les runners Windows consomment
# les minutes du forfait — 400/mois sur l'offre gratuite).

stages:
  - test
  - build


tests:
  stage: test
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    when: on_failure
    paths: [dist/]
    expire_in: 1 day

installeur-windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  # Le bouton de publication, dans l'onglet CI/CD — et le seul chemin pour
  # publier : il compile, envoie les fichiers, crée l'étiquette de version et la
  # page de téléchargement. Pousser une étiquette à la main ne déclenche donc
  # plus de compilation : un second chemin finirait par diverger, et mangerait
  # en double les minutes Windows du forfait.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    key: windows-deps
    # « always » : un échec à la publication ne doit pas jeter la chaîne Rust
    # et le registre des caisses, qui coûtent près de vingt minutes du forfait
    # à reconstruire. Le prochain essai doit être bon marché.
    when: always
    paths:
      - .cargo/registry/
      - src-tauri/target/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  before_script:
    # Le premier passage est long (~15 min) : les outils C++ et Rust sont
    # installés puis mis en cache pour les suivants.
    - choco install -y nodejs-lts --no-progress
    - choco install -y visualstudio2022-workload-vctools --no-progress
    - choco install -y rustup.install --no-progress
    # CARGO_HOME est déplacé dans le projet pour que le cache retienne le
    # registre, et rustup-init respecte cette variable : il y installe donc
    # aussi rustup.exe et cargo.exe. Les chercher dans le profil de
    # l’utilisateur ne les y trouve pas — c’est ce qui a fait échouer le
    # premier passage réel du pipeline. Les deux chemins sont donnés.
    - $env:Path = "$env:CARGO_HOME\bin;$env:USERPROFILE\.cargo\bin;C:\Program Files\nodejs;$env:Path"
    - Get-Command rustup, cargo, node | Select-Object Name, Source
    - rustup default stable-x86_64-pc-windows-msvc
    - node --version; rustc --version
  script:
    # Le numéro de version se vérifie avant de compiler, pas après : republier
    # un numéro déjà publié doit coûter une seconde, pas sept minutes de runner.
    - '$version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version'
    - '$api = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID"'
    - '$paquet = "$api/packages/generic/concours-petanque/$version"'
    - '$jeton = "JOB-TOKEN: " + $env:CI_JOB_TOKEN'
    - '$deja = curl.exe --silent --output NUL --write-out "%{http_code}" --header $jeton "$api/releases/v$version"'
    - 'if ($deja -eq "200") { throw "La version v$version est deja publiee. Changez le numero dans src-tauri/tauri.conf.json, poussez, puis relancez ce job." }'

    - npm ci
    - npm run app:build
    # Le même script qu'en local, pour que l'archive du pipeline soit
    # exactement ce qu'obtient quelqu'un qui compile sur sa machine.
    - node outils/portable.mjs
    - Compress-Archive -Path "portable/Concours de petanque" -DestinationPath concours-petanque-portable.zip -Force

    # Tauri nomme les installeurs d'après la version : on les retrouve donc par
    # leur extension, la seule chose qui ne bouge pas.
    - '$setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName'
    - '$msi = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName'

    # Le registre de paquets ne périme pas, contrairement aux artefacts de job :
    # c'est ce qui permet de donner au club un lien encore valide dans six mois.
    # Les noms perdent accents et espaces : une adresse doit pouvoir être écrite
    # à la main, ou dictée au téléphone.
    # curl ne décide pas de l'arrêt : GitLab coupe le job dès qu'une commande
    # sort en erreur, et emporterait le script avant la ligne qui explique
    # pourquoi. On lit donc le code nous-mêmes, puis on lève une erreur qui dit
    # quoi faire.
    - '$envoyer = { param($fichier, $nom) $c = curl.exe --silent --output NUL --write-out "%{http_code}" --header $jeton --upload-file $fichier "$paquet/$nom"; Write-Host "$nom  ->  HTTP $c"; if ($c -ne "201") { throw "Envoi de $nom refuse (HTTP $c). Si c est 403, activez le registre de paquets : Parametres > General > Visibilite, fonctionnalites, permissions > Paquets." } }'
    - '& $envoyer "concours-petanque-portable.zip" "concours-petanque-portable.zip"'
    - '& $envoyer $setup "concours-petanque-setup.exe"'
    - '& $envoyer $msi "concours-petanque.msi"'

    # L'API des versions crée l'étiquette elle-même à partir du commit : aucun
    # jeton d'écriture sur le dépôt à créer, à stocker, ni à renouveler quand il
    # expire. Le texte de la page vit dans le dépôt, relu comme le reste.
    # Lecture par .NET et non par Get-Content : celui-ci lit en ANSI — donc
    # massacre les accents — et renvoie une chaîne décorée de propriétés que
    # ConvertTo-Json sérialise en objet au lieu de texte.
    - '$lien = { param($nom, $fichier) @{ name = $nom; url = "$paquet/$fichier"; link_type = "package" } }'
    - '$corps = @{ name = "Concours de petanque v$version"; tag_name = "v$version"; ref = $env:CI_COMMIT_SHA; description = [IO.File]::ReadAllText((Join-Path $PWD "docs/notes-de-version.md")); assets = @{ links = @((& $lien "Version portable (rien a installer)" "concours-petanque-portable.zip"), (& $lien "Installeur, si WebView2 manque" "concours-petanque-setup.exe"), (& $lien "MSI, pour un poste gere" "concours-petanque.msi")) } }'
    - '[IO.File]::WriteAllText((Join-Path $PWD version.json), ($corps | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding $false))'
    - '$code = curl.exe --silent --output reponse.json --write-out "%{http_code}" --header $jeton --header "Content-Type: application/json" --data-binary "@version.json" "$api/releases"'
    - 'if ($code -ne "201") { throw "Creation de la version refusee (HTTP $code) : " + [IO.File]::ReadAllText((Join-Path $PWD "reponse.json")) }'
    - 'Write-Host "Publie : https://gitlab.com/$env:CI_PROJECT_PATH/-/releases/v$version"'
  artifacts:
    name: "concours-petanque-$CI_COMMIT_SHORT_SHA"
    paths:
      # Le portable d'abord : c'est ce qu'on met sur la clé.
      - concours-petanque-portable.zip
      # L'installeur reste comme filet : lui seul sait récupérer WebView2 s'il
      # manque sur un poste ancien.
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/release/bundle/msi/*.msi
    # Même chose : si la publication échoue, les fichiers compilés restent
    # récupérables plutôt que perdus avec le job.
    when: always
    expire_in: 30 days