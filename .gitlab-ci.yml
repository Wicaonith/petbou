# Deux étages : les tests tournent sur Linux à chaque poussée (rapide et gratuit),
# l'installeur Windows se déclenche à la main (les runners Windows consomment
# les minutes du forfait — 400/mois sur l'offre gratuite).

stages:
  - test
  - build

tests:
  stage: test
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  artifacts:
    when: on_failure
    paths: [dist/]
    expire_in: 1 day

installeur-windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  # Déclenchement manuel depuis l'onglet CI/CD, ou automatique sur une étiquette
  # de version (git tag v0.1.0 && git push --tags).
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    key: windows-deps
    paths:
      - .cargo/registry/
      - src-tauri/target/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  before_script:
    # Le premier passage est long (~15 min) : les outils C++ et Rust sont
    # installés puis mis en cache pour les suivants.
    - choco install -y nodejs-lts --no-progress
    - choco install -y visualstudio2022-workload-vctools --no-progress
    - choco install -y rustup.install --no-progress
    - $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\nodejs;$env:Path"
    - rustup default stable-x86_64-pc-windows-msvc
    - node --version; rustc --version
  script:
    - npm ci
    - npm run app:build
    # Le même script qu'en local, pour que l'archive du pipeline soit
    # exactement ce qu'obtient quelqu'un qui compile sur sa machine.
    - node outils/portable.mjs
    - Compress-Archive -Path "portable/Concours de petanque" -DestinationPath concours-petanque-portable.zip -Force
  artifacts:
    name: "concours-petanque-$CI_COMMIT_SHORT_SHA"
    paths:
      # Le portable d'abord : c'est ce qu'on met sur la clé.
      - concours-petanque-portable.zip
      # L'installeur reste comme filet : lui seul sait récupérer WebView2 s'il
      # manque sur un poste ancien.
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/release/bundle/msi/*.msi
    expire_in: 30 days
