[package]
name = "petbou"
version = "0.1.0"
description = "Gestion de concours de pétanque"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "petbou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
